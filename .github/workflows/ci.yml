name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  # 코드 검증 작업
  code-validation:
    name: 코드 검증
    runs-on: ubuntu-latest
    
    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4
    
    - name: Python 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8 mypy  # 코드 품질 도구
    
    - name: Python 문법 검사
      run: |
        echo "🔍 Python 문법 검사 중..."
        python -m py_compile src/server.py || (echo "❌ server.py 문법 오류" && exit 1)
        find src -name "*.py" -exec python -m py_compile {} \; || (echo "❌ Python 파일 문법 오류 발견" && exit 1)
        echo "✅ 문법 검사 통과"
    
    - name: Import 검사
      run: |
        echo "🔍 Import 검사 중..."
        python -c "import sys; sys.path.insert(0, '.'); from src.server import app; print('✅ Server Import 검사 통과')" || (echo "❌ Server Import 실패" && exit 1)
        python -c "import sys; sys.path.insert(0, '.'); from src.core.workflow import build_suno_request; print('✅ Core 모듈 Import 통과')" || (echo "❌ Core 모듈 Import 실패" && exit 1)
        python -c "import sys; sys.path.insert(0, '.'); from src.rag.orchestrator import RAGOrchestrator; print('✅ RAG 모듈 Import 통과')" || (echo "❌ RAG 모듈 Import 실패" && exit 1)
    
    - name: 코드 포맷팅 검사 (Black)
      continue-on-error: true
      run: |
        echo "🔍 코드 포맷팅 검사 중..."
        black --check src/ || echo "⚠️ 코드 포맷팅 이슈 발견 (경고만 표시)"
    
    - name: 린터 검사 (Flake8)
      continue-on-error: true
      run: |
        echo "🔍 린터 검사 중..."
        flake8 src/ --max-line-length=120 --ignore=E501,W503 || echo "⚠️ 린터 이슈 발견 (경고만 표시)"

  # Docker 빌드 테스트
  docker-build:
    name: Docker 이미지 빌드 테스트
    runs-on: ubuntu-latest
    
    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4
    
    - name: Docker 이미지 빌드
      run: |
        echo "🐳 Docker 이미지 빌드 중..."
        docker build -t melody-learning:test .
        echo "✅ Docker 이미지 빌드 성공"
    
    - name: Docker 이미지 검증
      run: |
        echo "🔍 Docker 이미지 검증 중..."
        docker run --rm melody-learning:test python --version
        docker run --rm melody-learning:test pip list | grep -E "(fastapi|uvicorn|openai)"
        echo "✅ Docker 이미지 검증 완료"

  # FastAPI 서버 시작 테스트
  server-test:
    name: FastAPI 서버 테스트
    runs-on: ubuntu-latest
    needs: [code-validation, docker-build]
    
    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4
    
    - name: Docker 이미지 빌드
      run: docker build -t melody-learning:test .
    
    - name: 서버 시작 테스트
      continue-on-error: true
      run: |
        echo "🚀 FastAPI 서버 시작 테스트 중..."
        # 백그라운드에서 서버 시작
        docker run -d --name test-server \
          -p 8000:8000 \
          -e OPENAI_API_KEY=test_key \
          -e SUNO_API_KEY=test_key \
          melody-learning:test || (echo "⚠️ Docker 컨테이너 시작 실패" && exit 0)
        
        # 서버가 시작될 때까지 대기
        echo "⏳ 서버 시작 대기 중..."
        sleep 15
        
        # 헬스 체크 (실패해도 계속 진행)
        echo "🔍 헬스 체크 중..."
        if curl -f http://localhost:8000/health 2>/dev/null; then
          echo "✅ 헬스 체크 성공"
        else
          echo "⚠️ 헬스 체크 실패 (API 키 없어서 정상일 수 있음)"
        fi
        
        # API 문서 엔드포인트 확인 (실패해도 계속 진행)
        echo "🔍 Docs 엔드포인트 확인 중..."
        if curl -f http://localhost:8000/docs 2>/dev/null; then
          echo "✅ Docs 엔드포인트 확인 성공"
        else
          echo "⚠️ Docs 엔드포인트 확인 실패"
        fi
        
        # 서버 중지 (실패해도 계속)
        docker stop test-server 2>/dev/null || true
        docker rm test-server 2>/dev/null || true
        echo "✅ 서버 시작 테스트 완료"

  # 배포 작업 (수동 트리거 또는 main/dev 브랜치에만)
  deploy:
    name: 배포 준비
    runs-on: ubuntu-latest
    needs: [code-validation, docker-build]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && 
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4
    
    - name: Docker 이미지 빌드
      run: |
        echo "🐳 배포용 Docker 이미지 빌드 중..."
        docker build -t melody-learning:latest .
        echo "✅ Docker 이미지 빌드 완료"
    
    - name: 배포 준비 완료
      run: |
        echo "✅ 모든 검증 통과!"
        echo "🚀 Railway에서 자동 배포가 시작됩니다 (GitHub 연결 시)"
        echo "또는 수동으로 Railway 대시보드에서 배포할 수 있습니다."

